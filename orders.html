<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order History & Invoices — Markus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
  <style>
    .orders-wrap { max-width: 1000px; margin: 32px auto; padding: 0 16px 64px; }
    .order-card { background: var(--color-navy-card); border: 1px solid var(--color-navy-border); border-radius: var(--radius-xl); padding: 24px; margin-bottom: 24px; }
    .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-navy-border); padding-bottom: 14px; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .order-item-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--color-navy-border); }
    .order-item-row:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <header class="header" id="mainHeader">
    <div class="header-top">
      <div class="container">
        <div class="header-top-inner">
          <a href="../index.html" class="logo" aria-label="Markus Home">
            <div class="logo-icon">
              <svg viewBox="0 0 40 40" fill="none" width="38" height="38">
                <rect width="40" height="40" rx="8" fill="#1E3A5F"/>
                <path d="M8 30L14 10L20 22L26 10L32 30" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="20" cy="22" r="3" fill="#FF6B35"/>
              </svg>
            </div>
            <div class="logo-text"><span class="logo-brand">Markus</span></div>
          </a>
          <div style="flex:1;text-align:center;">
            <h1 style="font-size:1.1rem;font-weight:700;color:var(--color-white);margin:0;">My Orders &amp; Invoices</h1>
          </div>
          <div class="header-actions">
            <a href="cart.html" class="header-action-btn cart-btn">
              <span class="action-value">Cart</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="orders-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
      <h2 style="font-size:1.6rem;font-weight:800;">Past Orders</h2>
      <a href="../index.html" class="btn-add-cart" style="text-decoration:none;font-size:0.85rem;">+ Shop More</a>
    </div>

    <div id="ordersContainer">
      <!-- Populated by JS -->
    </div>
  </div>

  <div class="toast-container" id="toastContainer" role="alert" aria-live="polite"></div>

  <script src="../js/security.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      MarkusStore.init();
      MarkusAuth.init();
      loadOrders();
    });

    function loadOrders() {
      const orders = MarkusStore.getOrders();
      const cont = document.getElementById('ordersContainer');
      if (!cont) return;

      if (!orders || orders.length === 0) {
        cont.innerHTML = `
          <div class="order-card" style="text-align:center;padding:48px 20px;">
            <div style="font-size:3rem;margin-bottom:12px;">📦</div>
            <h3 style="font-size:1.1rem;font-weight:700;margin-bottom:6px;">No orders found</h3>
            <p style="color:var(--color-gray);font-size:0.85rem;margin-bottom:20px;">You haven't placed any orders yet.</p>
            <a href="../index.html" class="btn-buy-now" style="text-decoration:none;display:inline-block;padding:10px 24px;">Start Shopping</a>
          </div>
        `;
        return;
      }

      cont.innerHTML = orders.map(o => `
        <div class="order-card">
          <div class="order-header">
            <div>
              <strong style="color:var(--color-orange);font-size:1rem;">Order #${o.id}</strong>
              <div style="font-size:0.75rem;color:var(--color-gray);margin-top:2px;">Placed on ${new Date(o.date).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
              <span style="background:rgba(34,197,94,0.1);color:#22C55E;padding:4px 12px;border-radius:12px;font-size:0.75rem;font-weight:700;">
                ${(o.status || 'Processing').toUpperCase()}
              </span>
              <button class="btn-add-cart" style="font-size:0.78rem;padding:6px 12px;" onclick='printInvoiceById("${o.id}")'>
                📄 GST Invoice
              </button>
              <a href="track.html?id=${o.id}" class="btn-buy-now" style="text-decoration:none;font-size:0.78rem;padding:6px 12px;">
                Track
              </a>
            </div>
          </div>

          <div>
            ${(o.items || []).map(i => `
              <div class="order-item-row">
                <div>
                  <span style="font-size:1.2rem;margin-right:8px;">${i.emoji || '📦'}</span>
                  <span style="font-size:0.9rem;font-weight:600;">${MarkusSecurity.sanitizeHTML(i.name)}</span>
                  <span style="font-size:0.8rem;color:var(--color-gray);margin-left:8px;">× ${i.quantity}</span>
                </div>
                <strong>₹${(i.price * i.quantity).toLocaleString('en-IN')}</strong>
              </div>
            `).join('')}
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;border-top:1px solid var(--color-navy-border);padding-top:12px;">
            <span style="font-size:0.82rem;color:var(--color-gray);">Payment: ${(o.paymentMethod || 'UPI').toUpperCase()}</span>
            <div style="font-size:1.1rem;font-weight:800;color:#fff;">
              Total: ₹${(o.total || 0).toLocaleString('en-IN')}
            </div>
          </div>
        </div>
      `).join('');
    }

    function printInvoiceById(id) {
      const orders = MarkusStore.getOrders();
      const order = orders.find(o => o.id === id);
      if (order) {
        MarkusInvoice.generate(order, MarkusAuth.getCurrentUser());
      } else {
        showToast('Order details not found', 'error');
      }
    }
  </script>
</body>
</html>
