<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fashion & Lifestyle — Markus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
</head>
<body>
  <header class="header" id="mainHeader">
    <div class="header-top">
      <div class="container">
        <div class="header-top-inner">
          <a href="../index.html" class="logo" aria-label="Markus Home">
            <div class="logo-icon">
              <svg viewBox="0 0 40 40" fill="none" width="38" height="38">
                <rect width="40" height="40" rx="8" fill="#1E3A5F"/>
                <path d="M8 30L14 10L20 22L26 10L32 30" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="20" cy="22" r="3" fill="#FF6B35"/>
              </svg>
            </div>
            <div class="logo-text"><span class="logo-brand">Markus</span></div>
          </a>
          <div style="flex:1;text-align:center;">
            <h1 style="font-size:1.1rem;font-weight:700;color:var(--color-white);margin:0;">Fashion &amp; Lifestyle</h1>
          </div>
          <div class="header-actions">
            <a href="wishlist.html" class="header-action-btn">
              <span class="action-value">Wishlist</span>
            </a>
            <a href="cart.html" class="header-action-btn cart-btn">
              <span class="action-value">Cart</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="container" style="max-width:1280px;margin:32px auto;padding:0 16px;">
    <div style="background:linear-gradient(135deg,rgba(10,22,40,0.95),rgba(30,58,95,0.9));border-radius:16px;padding:36px;border:1px solid var(--color-navy-border);margin-bottom:32px;">
      <h2 style="font-size:2rem;font-weight:800;color:#fff;margin-bottom:8px;">👕 Maker &amp; Engineer Lifestyle Apparel</h2>
      <p style="color:var(--color-gray);font-size:0.95rem;max-width:600px;">
        Premium heavyweight hoodies, tees, caps, and geek merchandise crafted for programmers, hardware makers, and robotics enthusiasts.
      </p>
    </div>

    <div class="products-grid" id="fashionProductsGrid" style="grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));"></div>
  </div>

  <div id="quickViewContainer"></div>
  <div class="toast-container" id="toastContainer" role="alert" aria-live="polite"></div>

  <script src="../js/security.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      MarkusStore.init();
      MarkusAuth.init();
      const list = MarkusStore.getAllProducts().filter(p => p.category === 'fashion');
      const grid = document.getElementById('fashionProductsGrid');
      if (grid) {
        grid.innerHTML = list.map(p => MarkusProducts.renderProductCard(p)).join('');
      }
    });
  </script>
</body>
</html>
