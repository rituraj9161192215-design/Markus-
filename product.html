<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Details — Markus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
  <style>
    .prod-layout { max-width: 1200px; margin: 32px auto; padding: 0 16px 64px; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
    .gallery-box { background: var(--color-navy-card); border: 1px solid var(--color-navy-border); border-radius: var(--radius-xl); padding: 48px; text-align: center; position: sticky; top: 120px; }
    .gallery-main-emoji { font-size: 7rem; line-height: 1; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4)); }
    .badge-wrap { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .price-display-huge { display: flex; align-items: baseline; gap: 14px; margin: 20px 0; }
    .current-huge { font-size: 2.2rem; font-weight: 800; color: #fff; }
    .original-huge { font-size: 1.2rem; color: var(--color-gray); text-decoration: line-through; }
    .discount-huge { font-size: 1rem; color: var(--color-orange); font-weight: 700; }
    .gst-tag { font-size: 0.8rem; color: var(--color-gray); margin-top: -12px; margin-bottom: 24px; }
    .spec-table { width: 100%; border-collapse: collapse; margin: 24px 0; font-size: 0.88rem; }
    .spec-table tr { border-bottom: 1px solid var(--color-navy-border); }
    .spec-table td { padding: 10px 8px; }
    .spec-table td:first-child { color: var(--color-gray); font-weight: 600; width: 35%; }
    .action-row { display: flex; gap: 16px; margin: 28px 0; }
    @media(max-width: 860px) {
      .prod-layout { grid-template-columns: 1fr; }
      .gallery-box { position: static; padding: 32px; }
    }
  </style>
</head>
<body>
  <header class="header" id="mainHeader">
    <div class="header-top">
      <div class="container">
        <div class="header-top-inner">
          <a href="../index.html" class="logo" aria-label="Markus Home">
            <div class="logo-icon">
              <svg viewBox="0 0 40 40" fill="none" width="38" height="38">
                <rect width="40" height="40" rx="8" fill="#1E3A5F"/>
                <path d="M8 30L14 10L20 22L26 10L32 30" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="20" cy="22" r="3" fill="#FF6B35"/>
              </svg>
            </div>
            <div class="logo-text"><span class="logo-brand">Markus</span></div>
          </a>
          <div class="header-actions">
            <a href="wishlist.html" class="header-action-btn" aria-label="Wishlist">
              <div class="icon-with-badge">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <span class="badge" id="wishlistBadge">0</span>
              </div>
              <span class="action-value">Wishlist</span>
            </a>
            <a href="cart.html" class="header-action-btn cart-btn" aria-label="Cart">
              <div class="icon-with-badge">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                <span class="badge cart-badge" id="cartBadge">0</span>
              </div>
              <span class="action-value">Cart</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="prod-layout" id="productDetailContainer">
    <!-- Populated by JS -->
    <div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--color-gray);">
      <div class="spinner"></div>
      <p style="margin-top:16px;">Loading product specifications...</p>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" role="alert" aria-live="polite"></div>

  <script src="../js/security.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      MarkusStore.init();
      MarkusAuth.init();

      const params = new URLSearchParams(window.location.search);
      const prodId = params.get('id') || 'elec-001';
      const product = MarkusStore.getProductById(prodId) || MarkusStore.getAllProducts()[0];

      if (!product) {
        document.getElementById('productDetailContainer').innerHTML = '<div style="grid-column:1/-1;text-align:center;">Product not found. <a href="../index.html">Return home</a></div>';
        return;
      }

      document.title = `${product.name} — Markus`;

      const specsRows = Object.entries(product.specs || {}).map(([k, v]) => `
        <tr><td>${MarkusSecurity.sanitizeHTML(k)}</td><td><strong>${MarkusSecurity.sanitizeHTML(v)}</strong></td></tr>
      `).join('');

      document.getElementById('productDetailContainer').innerHTML = `
        <div class="gallery-box">
          <div class="gallery-main-emoji">${MarkusSecurity.sanitizeHTML(product.emoji)}</div>
          <p style="margin-top:20px;color:var(--color-gray);font-size:0.9rem;">${MarkusSecurity.sanitizeHTML(product.brand)}</p>
          <div style="margin-top:16px;display:flex;justify-content:center;gap:12px;">
            <button class="btn-add-cart" style="font-size:0.8rem;" onclick="shareProduct('${product.id}')">🔗 Share</button>
            <button class="btn-add-cart" style="font-size:0.8rem;" onclick="toggleWishlist('${product.id}')">❤️ Wishlist</button>
          </div>
        </div>

        <div>
          <div class="badge-wrap">
            <span class="product-badge badge-new">${MarkusSecurity.sanitizeHTML(product.brand)}</span>
            ${product.badges.map(b => `<span class="product-badge badge-sale">${b.toUpperCase()}</span>`).join('')}
          </div>

          <h1 style="font-size:1.8rem;font-weight:800;color:#fff;line-height:1.3;margin-bottom:12px;">
            ${MarkusSecurity.sanitizeHTML(product.name)}
          </h1>

          <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
            <span style="background:var(--color-success);color:white;padding:3px 8px;border-radius:6px;font-size:0.82rem;font-weight:700;">★ ${product.rating}</span>
            <span style="color:var(--color-gray);font-size:0.85rem;">${product.reviewCount} verified reviews</span>
            <span style="color:#22C55E;font-size:0.85rem;">✔ In Stock (${product.stock} units)</span>
          </div>

          <div class="price-display-huge">
            <span class="current-huge">₹${product.price.toLocaleString('en-IN')}</span>
            ${product.originalPrice > product.price ? `<span class="original-huge">₹${product.originalPrice.toLocaleString('en-IN')}</span>` : ''}
            ${product.discount > 0 ? `<span class="discount-huge">${product.discount}% OFF</span>` : ''}
          </div>
          <div class="gst-tag">HSN Code: ${product.hsn || '8537'} · Inclusive of ${product.gstPercent}% GST (GST invoice provided)</div>

          <p style="color:#E2E8F0;font-size:0.95rem;line-height:1.7;margin-bottom:24px;">
            ${MarkusSecurity.sanitizeHTML(product.description)}
          </p>

          <div class="action-row">
            <button class="btn-add-cart" style="flex:1;padding:16px;font-size:1.05rem;" onclick="addToCart('${product.id}')">
              + Add to Cart
            </button>
            <button class="btn-buy-now" style="flex:1;padding:16px;font-size:1.05rem;" onclick="buyNowDirect('${product.id}')">
              ⚡ Buy Now
            </button>
          </div>

          <h3 style="font-size:1.1rem;font-weight:700;margin-top:32px;color:var(--color-orange);">Technical Specifications</h3>
          <table class="spec-table">
            <tbody>
              ${specsRows}
            </tbody>
          </table>

          <div style="background:var(--color-navy);border:1px solid var(--color-navy-border);border-radius:12px;padding:16px;margin-top:24px;font-size:0.82rem;color:var(--color-gray);">
            🚚 <strong>Free Pan-India Delivery</strong> on all orders above ₹499. Dispatch within 24 hours.
          </div>
        </div>
      `;
    });

    function buyNowDirect(id) {
      MarkusStore.addToCart(id, 1);
      window.location.href = 'checkout.html';
    }
  </script>
</body>
</html>
