<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projects, Robos & Drones — Markus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
  <style>
    .cat-hero-banner {
      background: linear-gradient(135deg, rgba(10,22,40,0.95), rgba(30,58,95,0.9)), url('../artifacts/hero_banner_1792335737534.jpg') center/cover;
      padding: 48px 16px;
      border-radius: var(--radius-xl);
      margin: 24px auto;
      max-width: 1280px;
      border: 1px solid var(--color-navy-border);
    }
    .cat-hero-title { font-size: 2.2rem; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .cat-hero-desc { color: var(--color-gray); font-size: 1rem; max-width: 650px; }
    .page-layout { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; display: grid; grid-template-columns: 260px 1fr; gap: 28px; }
    .filter-panel { background: var(--color-navy-card); border: 1px solid var(--color-navy-border); border-radius: var(--radius-lg); padding: 20px; position: sticky; top: 100px; height: fit-content; }
    .filter-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 16px; border-bottom: 1px solid var(--color-navy-border); padding-bottom: 10px; display: flex; justify-content: space-between; }
    .filter-group { margin-bottom: 20px; }
    .filter-group-title { font-size: 0.85rem; font-weight: 600; color: var(--color-gray); margin-bottom: 10px; text-transform: uppercase; }
    .filter-checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: #E2E8F0; margin-bottom: 8px; cursor: pointer; }
    .filter-checkbox-label input { accent-color: var(--color-orange); }
    .sort-bar { background: var(--color-navy-card); border: 1px solid var(--color-navy-border); border-radius: var(--radius-md); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .sort-select { background: var(--color-navy); border: 1px solid var(--color-navy-border); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; }
    @media(max-width: 860px) {
      .page-layout { grid-template-columns: 1fr; }
      .filter-panel { display: none; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header" id="mainHeader">
    <div class="header-top">
      <div class="container">
        <div class="header-top-inner">
          <a href="../index.html" class="logo" aria-label="Markus Home">
            <div class="logo-icon">
              <svg viewBox="0 0 40 40" fill="none" width="38" height="38">
                <rect width="40" height="40" rx="8" fill="#1E3A5F"/>
                <path d="M8 30L14 10L20 22L26 10L32 30" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="20" cy="22" r="3" fill="#FF6B35"/>
              </svg>
            </div>
            <div class="logo-text"><span class="logo-brand">Markus</span></div>
          </a>

          <div class="header-search-wrap">
            <div class="search-box">
              <input type="text" id="globalSearch" placeholder="Search robots, drones, kits..." aria-label="Search" />
              <button class="search-submit" aria-label="Submit search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </button>
            </div>
          </div>

          <div class="header-actions">
            <a href="wishlist.html" class="header-action-btn" aria-label="Wishlist">
              <div class="icon-with-badge">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <span class="badge" id="wishlistBadge">0</span>
              </div>
              <span class="action-value">Wishlist</span>
            </a>
            <a href="cart.html" class="header-action-btn cart-btn" aria-label="Cart">
              <div class="icon-with-badge">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                <span class="badge cart-badge" id="cartBadge">0</span>
              </div>
              <span class="action-value">Cart</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="cat-hero-banner">
      <h1 class="cat-hero-title">🦾 Projects, Robos &amp; Drones</h1>
      <p class="cat-hero-desc">From 6-DOF robotic arms and 8-legged spider crawlers to custom high-speed FPV racing drone kits, built for creators and engineers.</p>
    </div>

    <div class="page-layout">
      <!-- Filter Sidebar -->
      <aside class="filter-panel" aria-label="Product filters">
        <div class="filter-title">
          <span>Filters</span>
          <button onclick="resetFilters()" style="background:none;border:none;color:var(--color-orange);font-size:0.78rem;cursor:pointer;">Reset</button>
        </div>

        <div class="filter-group">
          <div class="filter-group-title">Type</div>
          <label class="filter-checkbox-label"><input type="checkbox" checked onchange="filterProducts()"/> Robotic Arms</label>
          <label class="filter-checkbox-label"><input type="checkbox" checked onchange="filterProducts()"/> Autonomous Bots</label>
          <label class="filter-checkbox-label"><input type="checkbox" checked onchange="filterProducts()"/> FPV Racing Drones</label>
          <label class="filter-checkbox-label"><input type="checkbox" checked onchange="filterProducts()"/> DIY Project Kits</label>
        </div>

        <div class="filter-group">
          <div class="filter-group-title">Difficulty Level</div>
          <label class="filter-checkbox-label"><input type="checkbox" checked/> Beginner Friendly</label>
          <label class="filter-checkbox-label"><input type="checkbox" checked/> Intermediate</label>
          <label class="filter-checkbox-label"><input type="checkbox" checked/> Advanced Maker</label>
        </div>
      </aside>

      <!-- Main Products Grid Area -->
      <main>
        <div class="sort-bar">
          <span style="font-size:0.9rem;color:var(--color-gray);" id="productCountText">Showing products</span>
          <div style="display:flex;align-items:center;gap:10px;">
            <label for="sortSelect" style="font-size:0.85rem;color:var(--color-gray);">Sort By:</label>
            <select id="sortSelect" class="sort-select" onchange="filterProducts()">
              <option value="featured">Featured</option>
              <option value="priceLow">Price: Low to High</option>
              <option value="priceHigh">Price: High to Low</option>
              <option value="rating">Customer Rating</option>
            </select>
          </div>
        </div>

        <div class="products-grid" id="categoryProductsGrid" style="grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));">
          <!-- Populated by JS -->
        </div>
      </main>
    </div>
  </div>

  <div id="quickViewContainer"></div>
  <div class="toast-container" id="toastContainer" role="alert" aria-live="polite"></div>

  <script src="../js/security.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      MarkusStore.init();
      MarkusAuth.init();
      loadCategoryProducts();
    });

    function loadCategoryProducts() {
      const prods = MarkusStore.getAllProducts().filter(p => p.category === 'robotics');
      renderProductList(prods);
    }

    function renderProductList(list) {
      const grid = document.getElementById('categoryProductsGrid');
      const countText = document.getElementById('productCountText');
      if (!grid) return;

      countText.textContent = `Showing ${list.length} robotics kits`;
      if (list.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--color-gray);">No robotics products found.</div>';
        return;
      }
      grid.innerHTML = list.map(p => MarkusProducts.renderProductCard(p)).join('');
    }

    function filterProducts() {
      let list = MarkusStore.getAllProducts().filter(p => p.category === 'robotics');
      const sortVal = document.getElementById('sortSelect')?.value;
      if (sortVal === 'priceLow') list.sort((a,b) => a.price - b.price);
      else if (sortVal === 'priceHigh') list.sort((a,b) => b.price - a.price);
      else if (sortVal === 'rating') list.sort((a,b) => b.rating - a.rating);

      renderProductList(list);
    }

    function resetFilters() {
      document.getElementById('sortSelect').value = 'featured';
      loadCategoryProducts();
    }
  </script>
</body>
</html>
